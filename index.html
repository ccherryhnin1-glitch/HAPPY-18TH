<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 18th Birthday!</title>
    <link rel="stylesheet" href="webbie.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo font-barbie"></i> Dear, My Crazy Soulmate</a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="webbiepage2.html">Memories</a></li>
                <li><a href="webbiepage3.html">Letterbox</a></li>
                <li><a href="webbiepage4.html">Make a Wish</a></li>
                <li><a href="webbiepage5.html">Treasure Map</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="card-pink home-grid">
            <div>
                <h1 class="font-barbie" style="font-size: 2.2rem; color: var(--barbie-magenta); margin-bottom: 0.5rem;">
                    Another year older? <br> What, like it's hard...!? 
                </h1>
                <p style="margin-bottom: 1.5rem; color: #6b21a8;"> </p>

                <div class="countdown-box">
                    <div class="time-card">
                        <div class="time-num" id="days">00</div>
                        <div class="time-label">Days</div>
                    </div>
                    <div class="time-card">
                        <div class="time-num" id="hours">00</div>
                        <div class="time-label">Hours</div>
                    </div>
                    <div class="time-card">
                        <div class="time-num" id="minutes">00</div>
                        <div class="time-label">Mins</div>
                    </div>
                    <div class="time-card">
                        <div class="time-num" id="seconds">00</div>
                        <div class="time-label">Secs</div>
                    </div>
                </div>

                <div style="background: #fff; padding: 1.2rem; border-radius: 16px; border-left: 5px solid var(--barbie-pink);">
                    <h2 class="font-script" style="font-size: 2rem; color: var(--barbie-magenta);"> Dearest Birthday Queen, </h2>
                    <p style="margin-top: 0.5rem; line-height: 1.6;">
                          Friday night and the lights are low... <br> except it’s your 18th birthday and it's time to shine!!                     </p>
                </div>
            </div>

            <div class="floating-frame">
                <img src="photo_4_2026-08-17_23-21-02.jpg" alt="Birthday Queen">
            </div>
        </div>
    </div>

    <script src="webbie.js"></script>
</body>
</html>
